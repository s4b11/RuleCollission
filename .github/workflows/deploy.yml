name: Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        default: all
        options: [all, backend, agent, web]

concurrency: deploy

jobs:
  backend:
    name: Backend to Modal
    if: inputs.target == 'all' || inputs.target == 'backend'
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install modal

      - name: Save backend settings as the Modal secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          WEB_APP_URL: ${{ vars.WEB_APP_URL }}
          CORS_ORIGINS: ${{ vars.WEB_APP_URL }}
          SEED_DEMO: "1"
        run: |
          names="DATABASE_URL JWT_SECRET AGENT_API_KEY DEMO_PASSWORD LIVEKIT_URL LIVEKIT_API_KEY LIVEKIT_API_SECRET
                 GROQ_API_KEY OPENAI_API_KEY R2_ENDPOINT R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET
                 WEB_APP_URL CORS_ORIGINS SEED_DEMO"
          settings=()
          for name in $names; do
            if [ -n "${!name}" ]; then settings+=("$name=${!name}"); fi
          done
          modal secret create rulecollision "${settings[@]}" --force

      - name: Deploy
        working-directory: backend
        run: modal deploy modal_app.py

      - name: Check the backend answers
        if: vars.BACKEND_URL != ''
        run: curl --fail --retry 6 --retry-delay 10 --retry-all-errors "${{ vars.BACKEND_URL }}/health"

  agent:
    name: Agent to LiveKit Cloud
    needs: backend
    if: always() && needs.backend.result != 'failure' && (inputs.target == 'all' || inputs.target == 'agent')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
      LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
      LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect the agent's settings
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "Set the repository variable BACKEND_URL to the backend address first." && exit 1
          fi
          list=""
          for name in BACKEND_URL AGENT_API_KEY DEEPGRAM_API_KEY CARTESIA_API_KEY GROQ_API_KEY OPENAI_API_KEY; do
            if [ -n "${!name}" ]; then list="$list,$name=${!name}"; fi
          done
          echo "SECRET_LIST=${list#,}" >> "$GITHUB_ENV"

      - name: Check whether the agent already exists
        id: config
        run: echo "exists=$([ -f agent/livekit.toml ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      - name: Create and deploy the agent (first run only)
        if: steps.config.outputs.exists == 'no'
        uses: livekit/deploy-action@v2
        with:
          OPERATION: create
          WORKING_DIRECTORY: agent

      - name: Keep the agent id in the repository
        if: steps.config.outputs.exists == 'no'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add agent/livekit.toml
          git diff --cached --quiet || (git commit -m "Add LiveKit agent config" && git push)

      - name: Deploy a new version
        if: steps.config.outputs.exists == 'yes'
        uses: livekit/deploy-action@v2
        with:
          OPERATION: deploy
          WORKING_DIRECTORY: agent

      - name: Wait until the agent is running
        uses: livekit/deploy-action@v2
        with:
          OPERATION: status-retry
          WORKING_DIRECTORY: agent
          TIMEOUT: 8m

  web:
    name: Web app to Cloudflare Pages
    needs: backend
    if: always() && needs.backend.result != 'failure' && (inputs.target == 'all' || inputs.target == 'web')
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.BACKEND_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "Set the repository variable BACKEND_URL to the backend address first." && exit 1
          fi
          npm ci
          npm run build
      - name: Deploy
        working-directory: frontend
        run: |
          npx wrangler@4 pages project create rulecollision --production-branch main || true
          npx wrangler@4 pages deploy dist --project-name rulecollision --branch main
