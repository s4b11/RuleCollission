[project]
name = "rulecollision-backend"
version = "0.2.0"
description = "RuleCollision backend: rule engine, cases, agent configuration, tools and knowledge search"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "networkx>=3.3",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pyjwt>=2.9",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pypdf>=5.0",
    "segno>=1.6",
    "openai>=1.50",
    "livekit-api>=1.0",
    "boto3>=1.35",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
embeddings = ["fastembed>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
